name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --force
        working-directory: ./smart-contracts

      - name: Compile contracts
        run: npm run compile
        working-directory: ./smart-contracts

      - name: Run tests
        run: npm run test
        working-directory: ./smart-contracts
